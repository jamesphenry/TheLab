[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aischool"
version = "0.1.0"
description = "Harness and coordination environment for the AI Learner Laboratory"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "The Lab Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
